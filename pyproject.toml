[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepsort-with-pytorch-v2"
version = "0.1.0"
description = "YOLOv8 + DeepSORT (PyTorch) package for vehicle detection and tracking"
readme = "README.md"
authors = [{ name = "Your Name" }]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["yolov8", "deepsort", "tracking", "pytorch", "computer-vision", "detrac"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
# Core Python dependencies excluding torch to avoid platform wheel conflicts; install torch via conda
dependencies = [
  "ultralytics>=8.2,<9.0",
  "deep-sort-realtime>=1.3.2",
  "opencv-python>=4.8",
  "PyYAML>=6.0",
  "typer>=0.12.0",
]

[project.scripts]
"deepsort-with-pytorch-v2" = "deepsort_with_pytorch_v2.cli:app"
"train" = "deepsort_with_pytorch_v2.train:main"
"infer" = "deepsort_with_pytorch_v2.infer:main"
"track" = "deepsort_with_pytorch_v2.track:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["deepsort_with_pytorch_v2*"]
